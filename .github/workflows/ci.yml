name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      # This job is TypeScript-only and deliberately does NOT set up Foundry.
      # Contracts (forge build/test) run in their own `contracts` job below —
      # they are the only package that needs forge, and they depend on nothing
      # else in the monorepo, so decoupling them keeps a foundry-nightly-style
      # upstream flake from blocking unrelated TS/HTML PRs.
      # `content`'s `build` is now TS-only (its circom step moved to
      # `build:circuit`), so it builds here. `passthrough` is pure wasm (needs
      # rust + wasm-pack, not set up here), so it stays excluded.
      - name: Build workspace packages
        run: pnpm -r --filter='!@lemmaoracle/contracts' --filter='!@lemmaoracle/passthrough' build

      - name: Run tests
        run: pnpm -r --filter='!@lemmaoracle/contracts' test

      # Bazaar middleware unit tests. packages/x402's `test` script runs
      # the circuit test (needs WASM build); the vitest suite has to be
      # run via the dedicated `test:vitest` script.
      - name: Run x402 vitest suite (bazaar middleware)
        run: pnpm --filter @lemmaoracle/x402 test:vitest

      # Bazaar schemas + OpenAPI sync (spec v0.2+). Validates the 10 JSON
      # Schemas, lints openapi.lemma.v2.json + checks $ref existence + the
      # x-bazaar extension shape, regenerates the bundled openapi, then
      # fails if the bundle has drifted from the source. See AGENTS.md
      # "Bazaar schemas + OpenAPI sync".
      - name: Validate Bazaar schemas
        run: pnpm --filter @lemmaoracle/spec validate:schemas

      - name: Validate OpenAPI
        run: pnpm --filter @lemmaoracle/spec validate:openapi

      - name: Rebuild bundled OpenAPI
        run: pnpm --filter @lemmaoracle/spec bundle:openapi

      - name: Fail if bundled OpenAPI is stale
        run: git diff --exit-code packages/spec/openapi.lemma.v2.bundled.json

      - name: Display test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript package tests executed via pnpm test" >> $GITHUB_STEP_SUMMARY
          echo "- Contracts tested with Forge in the dedicated \`contracts\` job" >> $GITHUB_STEP_SUMMARY

  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # foundry の nightly は「git タグが先に push され、バイナリの公開が
      # 1〜2 時間遅れる」窓があり、その間 foundryup が資産の無いタグを掴んで
      # HTTP 404 で失敗する（foundry-rs/foundry-toolchain#159）。窓の中では
      # 再実行しても同じタグを引くため復旧しない。安定版にピン留めして回避する。
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache Foundry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            packages/contracts/lib
            packages/x402/lib
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/contracts/foundry.toml', 'packages/x402/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Build contracts
        working-directory: ./packages/contracts
        run: forge build

      - name: Test contracts
        working-directory: ./packages/contracts
        run: forge test

      - name: Display contract test summary
        if: always()
        run: |
          echo "## Contracts Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Contracts built and tested with Forge" >> $GITHUB_STEP_SUMMARY
