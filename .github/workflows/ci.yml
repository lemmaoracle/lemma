name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            packages/contracts/lib
            packages/x402/lib
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/contracts/foundry.toml', 'packages/x402/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build contracts dependencies
        working-directory: ./packages/contracts
        run: forge build

      - name: Run tests
        run: pnpm test

      # Bazaar middleware unit tests. packages/x402's `test` script runs
      # the circuit test (needs WASM build); the vitest suite has to be
      # run via the dedicated `test:vitest` script.
      - name: Run x402 vitest suite (bazaar middleware)
        run: pnpm --filter @lemmaoracle/x402 test:vitest

      # Bazaar schemas + OpenAPI sync (spec v0.2+). Validates the 10 JSON
      # Schemas, lints openapi.lemma.v2.json + checks $ref existence + the
      # x-bazaar extension shape, regenerates the bundled openapi, then
      # fails if the bundle has drifted from the source. See AGENTS.md
      # "Bazaar schemas + OpenAPI sync".
      - name: Validate Bazaar schemas
        run: pnpm --filter @lemmaoracle/spec validate:schemas

      - name: Validate OpenAPI
        run: pnpm --filter @lemmaoracle/spec validate:openapi

      - name: Rebuild bundled OpenAPI
        run: pnpm --filter @lemmaoracle/spec bundle:openapi

      - name: Fail if bundled OpenAPI is stale
        run: git diff --exit-code packages/spec/openapi.lemma.v2.bundled.json

      - name: Display test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- All tests executed via pnpm test" >> $GITHUB_STEP_SUMMARY
          echo "- Contracts tested with Forge" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript packages tested with Vitest" >> $GITHUB_STEP_SUMMARY
