<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .wordmark { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-style: italic; font-weight: 500; fill: #FFFFFF; }
      .wordmark-l { font-size: 56px; }
      .wordmark-sup { font-size: 22px; }
      .wordmark-mma { font-size: 36px; }
      .headline { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-style: italic; font-size: 96px; font-weight: 500; fill: #FFFFFF; letter-spacing: -0.01em; }
      .headline-accent { fill: #B8723A; }
      .accent-rule { fill: #B8723A; }
      .subtitle { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 400; fill: rgba(255,255,255,0.78); letter-spacing: 0.01em; }
      .url { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: rgba(255,255,255,0.45); letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <!-- Wordmark: L^emma stylized -->
  <text class="wordmark wordmark-l" x="80" y="115">L</text>
  <text class="wordmark wordmark-sup" x="118" y="92">e</text>
  <text class="wordmark wordmark-mma" x="132" y="115">mma</text>

  <!-- Headline (2 lines, italic serif, white with AI in accent) -->
  <text class="headline" x="80" y="280">Give <tspan class="headline-accent">AI</tspan></text>
  <text class="headline" x="80" y="390">proven facts.</text>

  <!-- Small accent underline -->
  <rect class="accent-rule" x="80" y="430" width="56" height="2"/>

  <!-- Subtitle -->
  <text class="subtitle" x="80" y="495">The Trust Layer for AI.</text>

  <!-- URL bottom-right -->
  <text class="url" x="1120" y="590" text-anchor="end">lemma.frame00.com</text>
</svg>
