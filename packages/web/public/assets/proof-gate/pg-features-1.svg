<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="権限カードと操作の依頼の照合図。範囲外の発注は担当者の確認へ回る。">
  <rect x="0" y="0" width="640" height="360" rx="8" fill="#f3f4f1"/>
  <text x="32" y="44" font-family="sans-serif" font-size="17" font-weight="700" fill="#12140e">権限カード</text>
  <text x="32" y="66" font-family="sans-serif" font-size="12" fill="#5c6156">このAIに渡した操作の範囲</text>
  <rect x="32" y="80" width="248" height="118" rx="4" fill="#ffffff" stroke="#e1e3dd"/>
  <rect x="48" y="98" width="216" height="34" rx="4" fill="#eef6d8"/>
  <circle cx="66" cy="115" r="7" fill="#a8e010"/>
  <text x="80" y="120" font-family="sans-serif" font-size="13" fill="#12140e">支払いの実行</text>
  <rect x="48" y="142" width="216" height="34" rx="4" fill="#ffffff" stroke="#e1e3dd"/>
  <circle cx="66" cy="159" r="7" fill="none" stroke="#c25438" stroke-width="2"/>
  <text x="80" y="164" font-family="sans-serif" font-size="13" fill="#12140e">発注の実行（範囲外）</text>
  <text x="360" y="44" font-family="sans-serif" font-size="17" font-weight="700" fill="#12140e">操作の依頼</text>
  <text x="360" y="66" font-family="sans-serif" font-size="12" fill="#5c6156">AIが出そうとした操作</text>
  <rect x="360" y="80" width="248" height="118" rx="4" fill="#ffffff" stroke="#e1e3dd"/>
  <text x="380" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#12140e">発注の実行</text>
  <text x="380" y="144" font-family="sans-serif" font-size="12" fill="#5c6156">金額 48,000円</text>
  <text x="380" y="166" font-family="sans-serif" font-size="12" fill="#5c6156">宛先 shiharai@example</text>
  <line x1="288" y1="139" x2="352" y2="139" stroke="#4e7a00" stroke-width="2"/>
  <polygon points="352,139 342,133 342,145" fill="#4e7a00"/>
  <rect x="32" y="224" width="576" height="104" rx="4" fill="#12140e"/>
  <text x="52" y="258" font-family="sans-serif" font-size="14" font-weight="700" fill="#f4f7ef">照合の結果</text>
  <text x="52" y="284" font-family="sans-serif" font-size="13" fill="#b9c4ad">権限カードにない操作のため、実行しない</text>
  <rect x="380" y="288" width="208" height="26" rx="13" fill="none" stroke="#c25438" stroke-width="2"/>
  <text x="484" y="306" font-family="sans-serif" font-size="13" font-weight="700" fill="#e8927f" text-anchor="middle">担当者の確認へ</text>
</svg>
