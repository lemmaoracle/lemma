<svg viewBox="0 0 760 348" width="760" height="348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1title fig1desc">
<title id="fig1title">Figure 1 — How input records relate to the decision record</title>
<desc id="fig1desc">On the left, input records: an official bulletin and a sensor reading. In the centre, the decision record, containing what was decided and the inputs it referenced. On the right, the checking side. Inputs are embedded into the decision at record time, and the checking side traces back from the decision to the inputs.</desc>
<defs>
<style>
.t{font-family:"Space Grotesk","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.lbl{font-family:"Space Grotesk","Noto Sans JP","Hiragino Sans",sans-serif;font-size:11px;letter-spacing:1.05px;fill:#5c6156}
</style>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5c6156"/></marker>
<marker id="ah2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6f9c00"/></marker>
</defs>
<rect x="0" y="0" width="760" height="348" fill="#fcfaf5"/>

<text class="lbl" x="105" y="34" text-anchor="middle">INPUT RECORDS</text>
<rect x="20" y="48" width="170" height="52" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="105" y="72" text-anchor="middle" font-size="13" fill="#12140e">Official bulletin</text>
<text class="t" x="105" y="90" text-anchor="middle" font-size="11" fill="#5c6156">registered on ingest</text>
<rect x="20" y="112" width="170" height="52" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="105" y="136" text-anchor="middle" font-size="13" fill="#12140e">Sensor reading</text>
<text class="t" x="105" y="154" text-anchor="middle" font-size="11" fill="#5c6156">hash stored alongside</text>

<text class="lbl" x="400" y="34" text-anchor="middle">DECISION RECORD</text>
<rect x="290" y="48" width="220" height="116" rx="3" fill="#ebefe6" stroke="#6f9c00" stroke-width="1.5"/>
<rect x="290" y="48" width="220" height="4" fill="#a8e010"/>
<rect x="306" y="66" width="188" height="40" rx="2" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="400" y="90" text-anchor="middle" font-size="13" fill="#12140e">What was decided</text>
<rect x="306" y="112" width="188" height="40" rx="2" fill="#ffffff" stroke="#6f9c00" stroke-width="1" stroke-dasharray="3 2"/>
<text class="t" x="400" y="136" text-anchor="middle" font-size="13" fill="#4e7a00">Inputs it referenced</text>

<text class="lbl" x="655" y="34" text-anchor="middle">THE CHECKING SIDE</text>
<rect x="580" y="48" width="150" height="116" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="655" y="99" text-anchor="middle" font-size="12" fill="#12140e">Audit, incident report</text>
<text class="t" x="655" y="119" text-anchor="middle" font-size="12" fill="#12140e">Client, regulator</text>

<line x1="196" y1="106" x2="282" y2="106" stroke="#5c6156" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="t" x="239" y="98" text-anchor="middle" font-size="11" fill="#5c6156">embedded</text>
<text class="t" x="239" y="124" text-anchor="middle" font-size="11" fill="#5c6156">when recorded</text>

<path d="M655 176 L655 216 L105 216 L105 178" fill="none" stroke="#6f9c00" stroke-width="1.5" marker-end="url(#ah2)"/>
<line x1="400" y1="176" x2="400" y2="216" stroke="#6f9c00" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="322" y="206" width="156" height="20" fill="#fcfaf5"/>
<text class="t" x="400" y="221" text-anchor="middle" font-size="12" fill="#4e7a00">traced back later</text>

<line x1="20" y1="262" x2="740" y2="262" stroke="#a8e010" stroke-width="2"/>
<text class="t" x="20" y="288" font-size="11" fill="#5c6156">The moment a decision is finalized, it is registered as one record together with the inputs it referenced.</text>
<text class="t" x="20" y="308" font-size="11" fill="#5c6156">From that decision record, the checking side can trace back to the inputs it was looking at.</text>
</svg>
