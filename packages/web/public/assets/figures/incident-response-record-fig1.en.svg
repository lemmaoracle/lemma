<svg viewBox="0 0 760 348" width="760" height="348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1title fig1desc">
<title id="fig1title">Figure 1 — Checking the response record without exposing its contents</title>
<desc id="fig1desc">On the left, the site: saving the response record turns its contents into a private code. In the center, the reconciliation registry, which does the matching only — the contents stay private and are never registered. On the right, the checking side, the team at head office. It matches the code made from the record in hand against the code as saved. How that result is surfaced is open: a shared link, or the result pulled into an existing dashboard by API.</desc>
<defs>
<style>
.t{font-family:"Space Grotesk","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.lbl{font-family:"Space Grotesk","Noto Sans JP","Hiragino Sans",sans-serif;font-size:11px;letter-spacing:1.05px;fill:#5c6156}
</style>
<marker id="ir-ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5c6156"/></marker>
<marker id="ir-ah2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6f9c00"/></marker>
</defs>
<rect x="0" y="0" width="760" height="348" fill="#fcfaf5"/>

<text class="lbl" x="105" y="34" text-anchor="middle">INPUTS — THE SITE</text>
<rect x="20" y="48" width="170" height="52" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="105" y="72" text-anchor="middle" font-size="13" fill="#12140e">Save the record</text>
<text class="t" x="105" y="90" text-anchor="middle" font-size="11" fill="#5c6156">Contents stay internal</text>

<rect x="20" y="112" width="170" height="52" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="105" y="136" text-anchor="middle" font-size="13" fill="#12140e">Turned into a code</text>
<text class="t" x="105" y="154" text-anchor="middle" font-size="11" fill="#5c6156">Only the code is sent</text>

<text class="lbl" x="400" y="34" text-anchor="middle">RECONCILIATION REGISTRY</text>
<rect x="290" y="48" width="220" height="116" rx="3" fill="#ebefe6" stroke="#6f9c00" stroke-width="1.5"/>
<rect x="290" y="48" width="220" height="4" fill="#a8e010"/>
<rect x="306" y="66" width="188" height="40" rx="2" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="400" y="90" text-anchor="middle" font-size="13" fill="#12140e">Record matching</text>
<rect x="306" y="112" width="188" height="40" rx="2" fill="#ffffff" stroke="#6f9c00" stroke-width="1" stroke-dasharray="3 2"/>
<text class="t" x="400" y="136" text-anchor="middle" font-size="12" fill="#4e7a00">Private — never registered</text>

<text class="lbl" x="655" y="34" text-anchor="middle">THE CHECKING SIDE</text>
<rect x="580" y="48" width="150" height="116" rx="3" fill="#ffffff" stroke="#c3cabb" stroke-width="1"/>
<text class="t" x="655" y="99" text-anchor="middle" font-size="13" fill="#12140e">Head office</text>
<text class="t" x="655" y="119" text-anchor="middle" font-size="13" fill="#12140e">(the checking side)</text>

<line x1="196" y1="106" x2="282" y2="106" stroke="#5c6156" stroke-width="1.5" marker-end="url(#ir-ah)"/>
<text class="t" x="239" y="98" text-anchor="middle" font-size="11" fill="#5c6156">recorded</text>
<text class="t" x="239" y="124" text-anchor="middle" font-size="11" fill="#5c6156">when saved</text>

<path d="M655 176 L655 216 L105 216 L105 178" fill="none" stroke="#6f9c00" stroke-width="1.5" marker-end="url(#ir-ah2)"/>
<line x1="400" y1="176" x2="400" y2="216" stroke="#6f9c00" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="286" y="206" width="228" height="20" fill="#fcfaf5"/>
<text class="t" x="400" y="221" text-anchor="middle" font-size="12" fill="#4e7a00">matched by the code now</text>

<line x1="20" y1="262" x2="740" y2="262" stroke="#a8e010" stroke-width="2"/>
<text class="t" x="20" y="288" font-size="11" fill="#5c6156">The site only saves. The contents of the record are never sent and never go onto the registry.</text>
<text class="t" x="20" y="308" font-size="11" fill="#5c6156">The checking side matches the code made from the record in hand against the code as saved.</text>
<text class="t" x="20" y="328" font-size="11" fill="#5c6156">How the result is surfaced is open — a shared link, or pulled into an existing dashboard by API.</text>
</svg>
