# Redocly lint config for packages/spec/openapi.lemma.v2.json.
#
# Posture: enforce Bazaar-specific quality (new paths get summary +
# operationId + 4XX in this PR), but warn-only on the same fields for the
# legacy /v1/{health,schemas,circuits,doc-generators,documents,proofs,
# verified-attributes/query} paths that pre-date this guideline. A future
# PR retrofits summary/operationId to those legacy paths and tightens
# these to `error`.
extends:
  - recommended

rules:
  # Legacy paths inherited from openapi v0.1 lack these. Downgrade so the
  # follow-up retrofit lands as a separate PR.
  operation-summary: warn
  operation-operationId: warn
  operation-4xx-response: warn
